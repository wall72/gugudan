[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gugudan-app"
version = "0.1.0"
description = "CLI and Flask web gugudan app"
requires-python = ">=3.12"
dependencies = [
	"flask>=3.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]